<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker - Login Dinamico</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .login-box { max-width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login Form</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" required>
            
            <button type="submit">Accedi</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita il ricaricamento della pagina
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            // Controllo dimostrativo (lato client)
            if (user === "admin" && pass === "password123") {
                messageDiv.style.color = "green";
                messageDiv.textContent = "Benvenuto, " + user + "! Login effettuato con successo.";
            } else {
                messageDiv.style.color = "red";
                messageDiv.textContent = "Credenziali errate. Riprova.";
            }
        });
    </script>

</body>
</html>
